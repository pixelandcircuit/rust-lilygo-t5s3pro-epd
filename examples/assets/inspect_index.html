<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>embedded-inspect demo</title>
<style>
:root {
  --bg:       #0d1117;
  --surface:  #161b22;
  --border:   #30363d;
  --text:     #c9d1d9;
  --muted:    #8b949e;
  --accent:   #58a6ff;
  --green:    #3fb950;
  --yellow:   #d29922;
  --red:      #f85149;
  --orange:   #e3b341;
}
*,*::before,*::after { box-sizing: border-box; margin:0; padding:0 }

body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 'Cascadia Code','Fira Code','Consolas','Courier New',monospace;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── header ─────────────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 10;
}
h1 { font-size: 15px; color: var(--accent); font-weight: 600; letter-spacing: -.3px }
h1 span { color: var(--muted); font-weight: 400 }
#device-info { font-size: 12px; color: var(--muted) }
#device-name { color: var(--text); font-weight: 600 }
#connect-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
}
#connect-input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 12px;
  padding: 3px 8px;
  width: 200px;
}
#connect-input::placeholder { color: var(--muted) }
#connect-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  padding: 3px 10px;
}
#connect-btn:hover { color: var(--text) }
#status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--red);
  flex-shrink: 0;
}
#status.ok   .dot { background: var(--green) }
#status.warn .dot { background: var(--yellow) }

/* ── main ────────────────────────────────────────────────────── */
main { flex: 1; padding: 20px 24px 80px }

/* ── tree ────────────────────────────────────────────────────── */
.tree { font-size: 13px }

.struct-node { margin: 4px 0 }

.struct-header {
  display: flex;
  align-items: baseline;
  gap: 6px;
  cursor: pointer;
  user-select: none;
  color: var(--text);
  padding: 2px 0;
}
.struct-header:hover { color: #fff }

.chevron { font-size: 10px; color: var(--muted); width: 12px; display: inline-block }

.struct-label { font-weight: 600; color: var(--accent) }
.type-tag {
  font-size: 11px;
  color: var(--muted);
  padding: 1px 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface);
}

.children { padding-left: 22px }
.collapsed > .children { display: none }
.collapsed .chevron::before { content: '▸' }
.chevron::before { content: '▾' }

/* ── field row ───────────────────────────────────────────────── */
.field-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 3px 0 3px 20px;
  border-left: 1px solid transparent;
}
.field-row:hover { border-left-color: var(--border) }

.fn { color: var(--accent); min-width: 150px; flex-shrink: 0 }
.arrow { color: var(--border) }

.fv {
  color: var(--green);
  font-weight: 600;
  min-width: 60px;
}
@keyframes flash {
  0%   { color: #fff; background: rgba(210,153,34,.35); border-radius: 3px; padding: 0 3px }
  100% { color: var(--green); background: transparent; padding: 0 }
}
.fv.changed { animation: flash .7s ease-out forwards }

.badge {
  font-size: 11px;
  padding: 1px 5px;
  border-radius: 3px;
  border: 1px solid;
  line-height: 1.2;
}
.ro   { color: var(--muted); border-color: var(--border); background: var(--surface) }
.enum { color: #7ee787; border-color: #2d4a2d; background: #0d2210 }

/* ── write controls ─────────────────────────────────────────── */
.field-write {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: 4px;
}
.field-write input[type="number"],
.field-write input[type="text"],
.field-write select {
  background: #21262d;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 6px;
  font: inherit;
  font-size: 12px;
  width: 90px;
}
.field-write input[type="checkbox"] { cursor: pointer }
.field-write input:focus, .field-write select:focus { border-color: var(--accent); outline: none }
.field-write .set-btn {
  background: #21262d;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  font: inherit;
  font-size: 11px;
  cursor: pointer;
}
.field-write .set-btn:hover:not(:disabled) { border-color: var(--accent) }
.field-write .set-btn:disabled { opacity: .4; cursor: not-allowed }
.set-status { font-size: 11px; min-width: 2ch }
.set-status.ok  { color: var(--green) }
.set-status.err { color: var(--red) }

/* ── event log ───────────────────────────────────────────────── */
#events {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 6px 20px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  white-space: nowrap;
}
#events .label { color: var(--muted); flex-shrink: 0 }
#event-list { display: flex; gap: 14px; overflow: hidden }
.ev-item { flex-shrink: 0 }
.ev-path { color: var(--accent) }
.ev-val  { color: var(--orange) }

/* ── screenshot panel ────────────────────────────────────────── */
#screenshot-panel {
  margin-top: 24px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  overflow: hidden;
}

#screenshot-panel-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--border);
}
#screenshot-panel-header:hover { background: #1c2128 }
#screenshot-panel-header .chevron { color: var(--muted) }
#screenshot-panel-header .struct-label { color: var(--accent) }

#screenshot-panel-body {
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
#screenshot-panel.collapsed #screenshot-panel-body { display: none }
#screenshot-panel.collapsed #screenshot-panel-header .chevron::before { content: '▸' }
#screenshot-panel-header .chevron::before { content: '▾' }

.ss-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.ss-btn {
  background: #21262d;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 5px 14px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.ss-btn:hover:not(:disabled) {
  background: #30363d;
  border-color: var(--accent);
  color: #fff;
}
.ss-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}
.ss-btn.primary {
  background: #0d419d;
  border-color: var(--accent);
  color: #fff;
}
.ss-btn.primary:hover:not(:disabled) { background: #1158c7 }

#ss-status {
  font-size: 12px;
  color: var(--muted);
  min-height: 18px;
}
#ss-status.error { color: var(--red) }
#ss-status.ok    { color: var(--green) }

#ss-progress-wrap {
  display: none;
  align-items: center;
  gap: 10px;
}
#ss-progress-wrap.visible { display: flex }
#ss-progress {
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: var(--border);
  overflow: hidden;
  max-width: 320px;
}
#ss-progress-bar {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width .1s linear;
  border-radius: 3px;
}

#ss-canvas-wrap {
  display: none;
}
#ss-canvas-wrap.visible { display: block }

#ss-canvas {
  display: block;
  width: 480px;
  height: 270px;
  border: 1px solid var(--border);
  border-radius: 4px;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* ── logs panel ──────────────────────────────────────────────── */
#logs-panel {
  margin-top: 24px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  overflow: hidden;
}

#logs-panel-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--border);
}
#logs-panel-header:hover { background: #1c2128 }
#logs-panel-header .chevron { color: var(--muted) }
#logs-panel-header .struct-label { color: var(--accent) }

#logs-panel.collapsed #logs-panel-body { display: none }
#logs-panel.collapsed #logs-panel-header .chevron::before { content: '▸' }
#logs-panel-header .chevron::before { content: '▾' }

.logs-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.logs-toolbar select,
.logs-toolbar input[type="text"] {
  background: #21262d;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 8px;
  font: inherit;
  font-size: 12px;
  outline: none;
}
.logs-toolbar select:focus,
.logs-toolbar input[type="text"]:focus { border-color: var(--accent) }
.logs-toolbar input[type="text"] { width: 140px }

.logs-toolbar button {
  background: #21262d;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 3px 10px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.logs-toolbar button:hover {
  background: #30363d;
  border-color: var(--accent);
  color: #fff;
}
.logs-toolbar button.paused {
  border-color: var(--yellow);
  color: var(--yellow);
}

.logs-dropped {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(248, 81, 73, 0.15);
  border: 1px solid var(--red);
  color: var(--red);
}

#log-list {
  max-height: 320px;
  overflow-y: auto;
  font-family: 'Cascadia Code','Fira Code','Consolas','Courier New',monospace;
  font-size: 12px;
  line-height: 1.4;
  padding: 8px 12px;
}

.log-row { display: flex; gap: 6px; word-break: break-all }
.log-ts     { color: var(--muted); flex-shrink: 0 }
.log-level  { font-weight: 600; flex-shrink: 0; min-width: 5ch }
.log-target { color: var(--accent); flex-shrink: 0 }
.log-msg    { color: var(--text) }

.log-row.level-trace .log-level,
.log-row.level-trace .log-msg  { color: var(--muted) }
.log-row.level-debug .log-level,
.log-row.level-debug .log-msg  { color: var(--muted) }
.log-row.level-info  .log-level { color: var(--green) }
.log-row.level-warn  .log-level,
.log-row.level-warn  .log-msg  { color: var(--yellow) }
.log-row.level-error .log-level,
.log-row.level-error .log-msg  { color: var(--red) }

/* ── commands panel ─────────────────────────────────────── */
#commands-panel {
  margin-top: 24px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  overflow: hidden;
}
#commands-panel-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--border);
}
#commands-panel-header:hover { background: #1c2128 }
#commands-panel-header .chevron { color: var(--muted) }
#commands-panel-header .struct-label { color: var(--accent) }
#commands-panel.collapsed #commands-panel-body { display: none }
#commands-panel.collapsed #commands-panel-header .chevron::before { content: '▸' }
#commands-panel-header .chevron::before { content: '▾' }

#commands-list {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 14px;
}
.cmd-card {
  background: #161b22;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  min-width: 200px;
  flex: 1 1 200px;
  max-width: 380px;
}
.cmd-name {
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 8px;
}
.cmd-params {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 10px;
}
.cmd-params label {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.cmd-params input[type="number"],
.cmd-params input[type="text"],
.cmd-params select {
  background: #21262d;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 8px;
  font: inherit;
  font-size: 12px;
  outline: none;
  width: 110px;
}
.cmd-params input:focus, .cmd-params select:focus { border-color: var(--accent) }
.cmd-footer { display: flex; align-items: center; gap: 10px }
.cmd-run-btn {
  background: #21262d;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 4px 12px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.cmd-run-btn:hover { background: #30363d; border-color: var(--accent); color: #fff }
.cmd-run-btn:disabled { opacity: 0.5; cursor: default }
.cmd-status { font-size: 12px }
.cmd-status.ok  { color: var(--green) }
.cmd-status.err { color: var(--red) }
.cmd-status.pending { color: var(--muted) }

/* ── metrics panel ───────────────────────────────────────── */
#metrics-panel {
  margin-top: 24px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  overflow: hidden;
}
#metrics-panel-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--border);
}
#metrics-panel-header:hover { background: #1c2128 }
#metrics-panel-header .chevron { color: var(--muted) }
#metrics-panel-header .struct-label { color: var(--accent) }
#metrics-panel.collapsed #metrics-panel-body { display: none }
#metrics-panel.collapsed #metrics-panel-header .chevron::before { content: '▸' }
#metrics-panel-header .chevron::before { content: '▾' }

.metrics-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}
.metrics-toolbar label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px }
.metrics-toolbar select {
  background: #21262d;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 8px;
  font: inherit;
  font-size: 12px;
  outline: none;
}
.metrics-toolbar select:focus { border-color: var(--accent) }
.metrics-toolbar button {
  background: #21262d;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 3px 10px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.metrics-toolbar button:hover { background: #30363d; border-color: var(--accent); color: #fff }
.metrics-toolbar button.paused { border-color: var(--yellow); color: var(--yellow) }

.metrics-subscribe-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.metric-sub-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--muted);
}
.metric-sub-item input[type="checkbox"] { cursor: pointer; accent-color: var(--accent) }
.metric-sub-item label { cursor: pointer; color: var(--text) }
.metric-sub-item .metric-unit { color: var(--muted); font-size: 11px }

#metrics-charts { padding: 10px 14px; display: flex; flex-direction: column; gap: 16px }

.metric-card {
  background: #0d1117;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
}
.metric-card-header {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 6px;
}
.metric-path { font-size: 12px; color: var(--accent); font-weight: 600 }
.metric-unit-label { font-size: 11px; color: var(--muted) }
.metric-stats {
  margin-left: auto;
  display: flex;
  gap: 14px;
  font-size: 11px;
  color: var(--muted);
}
.metric-stats span { display: flex; gap: 4px }
.metric-stats .sv { color: var(--text); font-weight: 600 }
.metric-stats .cur .sv { color: var(--green) }
canvas.metric-canvas {
  display: block;
  width: 100%;
  height: 80px;
  border-radius: 4px;
  background: #0d1117;
}
</style>
</head>
<body>
<header>
  <h1>embedded-inspect</h1>
  <div id="device-info" style="display:none">
    <span id="device-name"></span>
    <span id="device-type" style="margin-left:6px;color:var(--muted)"></span>
  </div>
  <div id="connect-bar">
    <input id="connect-input" type="text" placeholder="hostname or IP (e.g. 192.168.1.42)">
    <button id="connect-btn" onclick="connectTo()">Connect</button>
    <div id="status">
      <span class="dot"></span>
      <span id="status-text">Connecting…</span>
    </div>
  </div>
</header>

<main>
  <div id="tree" class="tree"></div>

  <!-- ── screenshot panel ─────────────────────────────────────── -->
  <section id="screenshot-panel" class="collapsed">
    <div id="screenshot-panel-header">
      <span class="chevron"></span>
      <span class="struct-label">Screenshot</span>
      <span class="type-tag">Gray4 · 960×540</span>
    </div>
    <div id="screenshot-panel-body">
      <div class="ss-toolbar">
        <button class="ss-btn primary" id="ss-capture-btn" onclick="requestScreenshot()">Screenshot</button>
        <button class="ss-btn" id="ss-test-btn" onclick="testScreenshot()">Test Screenshot</button>
        <button class="ss-btn" id="ss-save" disabled onclick="saveScreenshot()">Save PNG</button>
      </div>
      <div id="ss-status">Ready.</div>
      <div id="ss-progress-wrap">
        <div id="ss-progress"><div id="ss-progress-bar"></div></div>
        <span id="ss-progress-label" style="font-size:12px;color:var(--muted)"></span>
      </div>
      <div id="ss-canvas-wrap">
        <canvas id="ss-canvas" width="960" height="540"></canvas>
      </div>
    </div>
  </section>

  <!-- ── logs panel ──────────────────────────────────────────────── -->
  <section id="logs-panel" class="collapsed">
    <div id="logs-panel-header">
      <span class="chevron"></span>
      <span class="struct-label">Logs</span>
      <span id="logs-count" class="type-tag">0 entries</span>
      <span id="logs-dropped-badge" class="logs-dropped" style="display:none">dropped: 0</span>
      <div class="logs-toolbar">
        <select id="log-level-filter">
          <option value="0">trace+</option>
          <option value="1" selected>debug+</option>
          <option value="2">info+</option>
          <option value="3">warn+</option>
          <option value="4">error</option>
        </select>
        <input type="text" id="log-search" placeholder="filter…">
        <button id="log-trigger-btn">Log test</button>
        <button id="log-pause-btn">Pause</button>
        <button id="log-clear-btn">Clear</button>
      </div>
    </div>
    <div id="logs-panel-body">
      <div id="log-list"></div>
    </div>
  </section>

  <!-- ── commands panel ─────────────────────────────────────── -->
  <section id="commands-panel" class="collapsed">
    <div id="commands-panel-header">
      <span class="chevron"></span>
      <span class="struct-label">Commands</span>
      <span id="commands-count" class="type-tag">0 commands</span>
    </div>
    <div id="commands-panel-body">
      <div id="commands-list"></div>
    </div>
  </section>

  <!-- ── metrics panel ──────────────────────────────────────── -->
  <section id="metrics-panel" class="collapsed">
    <div id="metrics-panel-header">
      <span class="chevron"></span>
      <span class="struct-label">Metrics</span>
      <span id="metrics-count" class="type-tag">0 available</span>
    </div>
    <div id="metrics-panel-body">
      <div class="metrics-toolbar">
        <label>Interval <select id="metrics-interval">
          <option value="200">200 ms</option>
          <option value="500" selected>500 ms</option>
          <option value="1000">1 s</option>
          <option value="2000">2 s</option>
          <option value="5000">5 s</option>
        </select></label>
        <label>Window <select id="metrics-window">
          <option value="30">30 s</option>
          <option value="60" selected>60 s</option>
          <option value="120">2 min</option>
          <option value="300">5 min</option>
        </select></label>
        <button id="metrics-pause-btn">Pause</button>
        <button id="metrics-unsub-btn">Unsubscribe All</button>
      </div>
      <div class="metrics-subscribe-list" id="metrics-subscribe-list">
        <span style="color:var(--muted);font-size:12px">No metric fields discovered yet.</span>
      </div>
      <div id="metrics-charts"></div>
    </div>
  </section>
</main>

<div id="events">
  <span class="label">events</span>
  <div id="event-list"><span style="color:var(--muted)">—</span></div>
</div>

<script>
'use strict';

// ─── state ─────────────────────────────────────────────────────────────────
let ws, nextId = 1;
const pending = {};       // request_id → resolve fn
const recentEvts = [];    // last N events for the footer

// ─── screenshot state ───────────────────────────────────────────────────────
let ssMeta    = null;   // ScreenshotBegin payload
let ssBuffer  = null;   // Uint8Array assembled pixel data
let ssChunksReceived = 0;

// ─── logs state ─────────────────────────────────────────────────────────────
const PAGE_LOAD_TIME = Date.now();
const LOG_MAX = 500;
const LOG_LEVELS = { trace: 0, debug: 1, info: 2, warn: 3, error: 4 };
const logEntries = [];
let logPaused = false;
let logNeedsRender = false;
let totalDropped = 0;

// ─── connection ─────────────────────────────────────────────────────────────
let targetHost = location.host;

function connectTo() {
  const input = document.getElementById('connect-input').value.trim();
  if (!input) return;
  // If no port specified and looks like a bare host, default to port 8080
  targetHost = input.includes(':') ? input : `${input}:8080`;
  if (ws) ws.close();
  connect();
}

function connect() {
  const url = `ws://${targetHost}/debug`;
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen  = ()    => send({ type:'Hello', request_id: nextId++, version:1, client_name:'browser' });
  ws.onclose = ()    => { setStatus('warn','Disconnected — retrying…'); setTimeout(connect,3000) };
  ws.onerror = ()    => setStatus('warn','Connection error');
  ws.onmessage = ({data}) => {
    if (data instanceof ArrayBuffer) {
      handleBinaryFrame(data);
    } else {
      try { dispatch(JSON.parse(data)) } catch(e) { console.error(e) }
    }
  };
}

function send(msg) {
  if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

// Returns a promise that resolves when the matching response arrives.
function request(msg) {
  return new Promise(resolve => {
    pending[msg.request_id] = resolve;
    send(msg);
  });
}

// ─── dispatch ───────────────────────────────────────────────────────────────
function dispatch(msg) {
  // Resolve pending request callbacks first (SchemaResponse, ResponseValue, etc.)
  if (msg.request_id != null && pending[msg.request_id]) {
    const resolve = pending[msg.request_id];
    delete pending[msg.request_id];
    resolve(msg);
    return;
  }

  switch (msg.type) {
    case 'HelloAck': {
      const devName = msg.device_name || msg.server_name;
      const devType = msg.device_type || '';
      setStatus('ok', `Connected  ·  v${msg.version}`);
      const info = document.getElementById('device-info');
      document.getElementById('device-name').textContent = devName;
      document.getElementById('device-type').textContent = devType ? `[${devType}]` : '';
      info.style.display = devName ? '' : 'none';
      if (msg.mdns_hostname) {
        document.getElementById('connect-input').value = msg.mdns_hostname;
      }
      discoverAndRender();
      break;
    }

    case 'ValueChanged':
      setValue(msg.path, msg.value);
      logEvent(msg.path, msg.value, msg.sequence);
      break;

    case 'ScreenshotBegin':
      handleScreenshotBegin(msg);
      break;

    case 'ScreenshotEnd':
      handleScreenshotEnd(msg);
      break;

    case 'LogRecord':
      handleLogRecord(msg);
      break;

    case 'MetricBatch':
      handleMetricBatch(msg);
      break;

    case 'Error':
      console.warn('[server error]', msg);
      break;
  }
}

// ─── schema discovery ───────────────────────────────────────────────────────
async function discoverAndRender() {
  const [schemaResp] = await Promise.all([
    request({ type:'GetSchema', request_id: nextId++ }),
    getAndRenderCommands(),
  ]);
  if (schemaResp.type !== 'SchemaResponse') return;

  const root = document.getElementById('tree');
  root.innerHTML = '';
  root.appendChild(renderNode(schemaResp.schema, ''));

  // Discover metric fields and populate the metrics panel subscribe list.
  const mfields = collectMetricFields(schemaResp.schema, '');
  renderMetricSubscribeList(mfields);

  // Fetch initial values for all leaf paths concurrently.
  const leaves = collectLeaves(schemaResp.schema, '');
  await Promise.all(leaves.map(fetchValue));
}

async function getAndRenderCommands() {
  const resp = await request({ type:'GetCommands', request_id: nextId++ });
  if (resp.type !== 'CommandsResponse') return;
  renderCommands(resp.commands);
}

function renderCommands(commands) {
  const list = document.getElementById('commands-list');
  list.innerHTML = '';
  const count = document.getElementById('commands-count');
  count.textContent = `${commands.length} command${commands.length === 1 ? '' : 's'}`;

  if (commands.length > 0) {
    document.getElementById('commands-panel').classList.remove('collapsed');
  }

  for (const cmd of commands) {
    const card = el('div', 'cmd-card');
    card.dataset.name = cmd.name;

    const nameEl = el('div', 'cmd-name');
    nameEl.textContent = cmd.name;
    card.appendChild(nameEl);

    if (cmd.description) {
      const desc = el('div', 'cmd-desc');
      desc.textContent = cmd.description;
      desc.style.cssText = 'font-size:11px;color:var(--muted);margin-bottom:8px';
      card.appendChild(desc);
    }

    const paramsEl = el('div', 'cmd-params');
    for (const param of cmd.params) {
      const lbl = el('label');
      lbl.textContent = param.name + ' ';

      let input;
      const k = param.kind;
      if (k.type === 'bool') {
        input = el('input');
        input.type = 'checkbox';
        input.dataset.kind = 'bool';
      } else if (['u8','u16','u32','u64','i8','i16','i32','i64','f32','f64'].includes(k.type)) {
        input = el('input');
        input.type = 'number';
        input.value = '0';
        input.dataset.kind = k.type;
      } else if (k.type === 'str') {
        input = el('input');
        input.type = 'text';
        input.dataset.kind = 'str';
      } else if (k.type === 'enum') {
        input = el('select');
        input.dataset.kind = 'enum';
        for (const v of k.variants) {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          input.appendChild(opt);
        }
      } else {
        input = el('input');
        input.type = 'text';
        input.dataset.kind = k.type;
      }

      input.dataset.paramName = param.name;
      lbl.appendChild(input);
      paramsEl.appendChild(lbl);
    }
    card.appendChild(paramsEl);

    const footer = el('div', 'cmd-footer');
    const runBtn = el('button', 'cmd-run-btn');
    runBtn.textContent = 'Run';
    const statusEl = el('span', 'cmd-status');
    footer.append(runBtn, statusEl);
    card.appendChild(footer);

    runBtn.addEventListener('click', async () => {
      const inputs = paramsEl.querySelectorAll('[data-kind]');
      const args = Array.from(inputs).map(inp => {
        const kind = inp.dataset.kind;
        if (kind === 'bool') return { kind: 'bool', value: inp.checked };
        if (kind === 'enum') return { kind: 'enum', value: inp.value };
        if (kind === 'str') return { kind: 'str', value: inp.value };
        return { kind, value: Number(inp.value) };
      });

      runBtn.disabled = true;
      statusEl.className = 'cmd-status pending';
      statusEl.textContent = '…';

      try {
        const resp = await request({ type:'InvokeCommand', request_id: nextId++, name: cmd.name, args });
        if (resp.output?.ok === false) {
          statusEl.className = 'cmd-status err';
          statusEl.textContent = `✗ ${resp.output.error}`;
        } else {
          const dur = resp.duration_ms != null ? ` (${resp.duration_ms} ms)` : '';
          statusEl.className = 'cmd-status ok';
          statusEl.textContent = `✓ OK${dur}`;
        }
      } catch (e) {
        statusEl.className = 'cmd-status err';
        statusEl.textContent = '✗ timeout';
      } finally {
        runBtn.disabled = false;
      }
    });

    list.appendChild(card);
  }
}

async function fetchValue(path) {
  const resp = await request({ type:'GetValue', request_id: nextId++, path });
  if (resp.type === 'ResponseValue') setValue(resp.path, resp.value);
}

// ─── schema rendering ───────────────────────────────────────────────────────
function renderNode(schema, path) {
  if (schema.kind === 'Struct') return renderStruct(schema, path);
  return renderLeaf(schema, path.split('.').pop() ?? path, path, { read_only: true });
}

function renderStruct(schema, path) {
  const wrap = el('div', 'struct-node');

  // Collapsible header
  const header = el('div', 'struct-header');
  const chevron = el('span', 'chevron');
  const label = el('span', 'struct-label');
  label.textContent = path ? path.split('.').pop() : schema.type_name;
  const tag = el('span', 'type-tag');
  tag.textContent = schema.type_name;
  header.append(chevron, label, tag);
  header.onclick = () => wrap.classList.toggle('collapsed');
  wrap.appendChild(header);

  // Children
  const children = el('div', 'children');
  for (const f of schema.fields) {
    const fp = path ? `${path}.${f.name}` : f.name;
    children.appendChild(
      f.schema.kind === 'Struct'
        ? renderStruct(f.schema, fp)
        : renderLeaf(f.schema, f.name, fp, f)
    );
  }
  wrap.appendChild(children);
  return wrap;
}

function renderLeaf(schema, name, path, fieldMeta) {
  // fieldMeta is either a field object {read_only, min_val, max_val} or a legacy bool
  const readOnly = (typeof fieldMeta === 'boolean') ? fieldMeta : (fieldMeta?.read_only ?? true);
  const minVal   = fieldMeta?.min_val ?? null;
  const maxVal   = fieldMeta?.max_val ?? null;

  const row = el('div', 'field-row');
  row.dataset.path = path;

  const nameEl = el('span', 'fn');
  nameEl.textContent = name;

  const arrow = el('span', 'arrow');
  arrow.textContent = '▸';

  const val = el('span', 'fv');
  val.id = `v:${path}`;
  val.textContent = '…';

  row.append(nameEl, arrow, val);

  if (readOnly) {
    const b = el('span', 'badge ro'); b.textContent = 'ro'; row.appendChild(b);
  }
  if (schema.kind === 'Enum') {
    const b = el('span', 'badge enum'); b.textContent = schema.type_name; row.appendChild(b);
  }

  if (!readOnly) {
    // Build write control based on schema kind
    const wrap = el('div', 'field-write');
    let input;
    const kind = schema.kind === 'Primitive' ? schema.primitive : schema.kind.toLowerCase();

    if (kind === 'bool') {
      input = el('input'); input.type = 'checkbox'; input.dataset.kind = 'bool';
    } else if (['u8','u16','u32','u64','u128','i8','i16','i32','i64','i128','f32','f64'].includes(kind)) {
      input = el('input'); input.type = 'number'; input.value = '0'; input.dataset.kind = kind;
      if (minVal !== null) input.min = minVal;
      if (maxVal !== null) input.max = maxVal;
    } else if (kind === 'str' || kind === 'string') {
      input = el('input'); input.type = 'text'; input.dataset.kind = 'str';
    } else if (schema.kind === 'Enum') {
      input = el('select'); input.dataset.kind = 'enum';
      for (const v of schema.variants ?? []) {
        const opt = document.createElement('option');
        opt.value = v; opt.textContent = v; input.appendChild(opt);
      }
    } else {
      input = el('input'); input.type = 'text'; input.dataset.kind = 'str';
    }
    input.dataset.fieldPath = path;

    const btn = el('button', 'set-btn'); btn.textContent = 'Set';
    const status = el('span', 'set-status');
    wrap.append(input, btn, status);
    row.appendChild(wrap);

    btn.addEventListener('click', async () => {
      const k = input.dataset.kind;
      let value;
      if (k === 'bool')  value = { kind: 'bool', value: input.checked };
      else if (k === 'enum') value = { kind: 'enum', value: input.value };
      else if (k === 'str')  value = { kind: 'str', value: input.value };
      else                   value = { kind: k, value: Number(input.value) };

      btn.disabled = true;
      status.className = 'set-status';
      status.textContent = '…';
      try {
        const resp = await request({ type: 'SetValue', request_id: nextId++, path, value });
        if (resp.type === 'SetValueAck') {
          status.className = 'set-status ok'; status.textContent = '✓';
        } else {
          status.className = 'set-status err';
          status.textContent = `✗ ${resp.code ?? resp.type}`;
        }
      } catch (e) {
        status.className = 'set-status err'; status.textContent = '✗';
      } finally {
        btn.disabled = false;
        setTimeout(() => { status.className = 'set-status'; status.textContent = ''; }, 3000);
      }
    });
  }

  return row;
}

// ─── value updates ──────────────────────────────────────────────────────────
function collectLeaves(schema, prefix) {
  if (schema.kind === 'Struct') {
    return schema.fields.flatMap(f => {
      const p = prefix ? `${prefix}.${f.name}` : f.name;
      return f.schema.kind === 'Struct' ? collectLeaves(f.schema, p) : [p];
    });
  }
  return prefix ? [prefix] : [];
}

function setValue(path, raw) {
  const el = document.getElementById(`v:${path}`);
  if (!el) return;
  const text = fmt(raw);
  if (el.textContent === text) return;   // no-op if unchanged
  el.textContent = text;
  el.classList.remove('changed');
  void el.offsetWidth;                   // force reflow → restart animation
  el.classList.add('changed');
}

function fmt(v) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'boolean') return String(v);
  if (typeof v === 'number')  return String(v);
  if (typeof v === 'string')  return v;
  if (typeof v === 'object') {
    if ('variant' in v) return v.variant;
    if ('object'  in v) return `{${v.object}}`;
  }
  return JSON.stringify(v);
}

// ─── event log ──────────────────────────────────────────────────────────────
function logEvent(path, value, seq) {
  recentEvts.unshift({ path, value, seq });
  if (recentEvts.length > 6) recentEvts.pop();

  document.getElementById('event-list').innerHTML = recentEvts.map(e =>
    `<span class="ev-item">#${e.seq}&nbsp;<span class="ev-path">${e.path}</span>&nbsp;=&nbsp;<span class="ev-val">${fmt(e.value)}</span></span>`
  ).join('');
}

// ─── screenshot: outgoing ───────────────────────────────────────────────────
function requestScreenshot() {
  ssReset();
  ssSetStatus('', 'Requesting…');
  send({ type: 'GetScreenshot', request_id: nextId++, format: 'Gray4' });
  // expand the panel if collapsed
  document.getElementById('screenshot-panel').classList.remove('collapsed');
}

// ─── screenshot: incoming text frames ──────────────────────────────────────
function handleScreenshotBegin(msg) {
  ssMeta = {
    capture_id:   msg.capture_id,
    width:        msg.width,
    height:       msg.height,
    format:       msg.format,
    total_bytes:  msg.total_bytes,
    chunk_size:   msg.chunk_size,
    total_chunks: msg.total_chunks,
  };
  ssBuffer = new Uint8Array(msg.total_bytes);
  ssChunksReceived = 0;
  ssSetProgress(0, msg.total_chunks);
  ssShowProgress(true);
  ssSetStatus('', `0/${msg.total_chunks} chunks`);
}

function handleScreenshotEnd(msg) {
  if (!ssMeta || msg.capture_id !== ssMeta.capture_id) return;

  if (ssChunksReceived !== ssMeta.total_chunks) {
    ssSetStatus('error', `Chunk mismatch: got ${ssChunksReceived}, expected ${ssMeta.total_chunks}`);
    ssShowProgress(false);
    return;
  }

  // Checksum: sum all bytes as wrapping uint32
  const checksum = ssBuffer.reduce((s, b) => (s + b) >>> 0, 0);
  if (checksum !== msg.total_checksum) {
    ssSetStatus('error', `Checksum mismatch: got ${checksum}, expected ${msg.total_checksum}`);
    ssShowProgress(false);
    return;
  }

  ssShowProgress(false);
  renderScreenshot(ssBuffer, ssMeta.width, ssMeta.height);
  ssSetStatus('ok', `Complete — ${ssMeta.width}×${ssMeta.height} Gray4`);
  document.getElementById('ss-save').disabled = false;
}

// ─── screenshot: incoming binary frames ────────────────────────────────────
function handleBinaryFrame(buf) {
  if (!ssMeta || !ssBuffer) return;

  const view = new DataView(buf);
  const captureId  = view.getUint32(0, true);   // little-endian
  const chunkIndex = view.getUint32(4, true);   // little-endian
  const pixelData  = new Uint8Array(buf, 8);

  if (captureId !== ssMeta.capture_id) return;

  const offset = chunkIndex * ssMeta.chunk_size;
  ssBuffer.set(pixelData, offset);
  ssChunksReceived++;

  ssSetProgress(ssChunksReceived, ssMeta.total_chunks);
  ssSetStatus('', `${ssChunksReceived}/${ssMeta.total_chunks} chunks`);
}

// ─── screenshot: Gray4 → ImageData ─────────────────────────────────────────
function gray4ToImageData(pixels, width, height) {
  const data = new Uint8ClampedArray(width * height * 4);
  const halfWidth = width / 2;
  for (let i = 0; i < pixels.length; i++) {
    const byte = pixels[i];
    const lo = (byte & 0x0F) * 17;          // even col (left pixel)
    const hi = ((byte >> 4) & 0x0F) * 17;   // odd col  (right pixel)
    const col = (i % halfWidth) * 2;
    const row = Math.floor(i / halfWidth);
    const base0 = (row * width + col) * 4;
    const base1 = base0 + 4;
    data[base0]   = data[base0+1] = data[base0+2] = lo; data[base0+3] = 255;
    data[base1]   = data[base1+1] = data[base1+2] = hi; data[base1+3] = 255;
  }
  return new ImageData(data, width, height);
}

function renderScreenshot(pixels, width, height) {
  const canvas = document.getElementById('ss-canvas');
  canvas.width  = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.putImageData(gray4ToImageData(pixels, width, height), 0, 0);
  document.getElementById('ss-canvas-wrap').classList.add('visible');
}

// ─── screenshot: save PNG ───────────────────────────────────────────────────
function saveScreenshot() {
  const canvas = document.getElementById('ss-canvas');
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = `screenshot-${Date.now()}.png`;
  a.click();
}

// ─── screenshot: synthetic test ─────────────────────────────────────────────
function syntheticFramebuffer(width, height) {
  const halfWidth = width / 2;
  const bytes = new Uint8Array(halfWidth * height);
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x += 2) {
      const lo = Math.floor((x / width) * 16) & 0xF;
      const hi = Math.floor(((x + 1) / width) * 16) & 0xF;
      bytes[y * halfWidth + x / 2] = (hi << 4) | lo;
    }
  }
  return bytes;
}

function testScreenshot() {
  const width = 960, height = 540;
  ssReset();
  document.getElementById('screenshot-panel').classList.remove('collapsed');
  ssSetStatus('', 'Running synthetic test…');

  const pixels = syntheticFramebuffer(width, height);

  // Simulate the assembly pipeline directly
  ssMeta = { capture_id: 0, width, height, format: 'Gray4',
             total_bytes: pixels.length, chunk_size: 4096,
             total_chunks: Math.ceil(pixels.length / 4096) };
  ssBuffer = new Uint8Array(pixels.length);
  ssBuffer.set(pixels);
  ssChunksReceived = ssMeta.total_chunks;

  renderScreenshot(ssBuffer, width, height);
  ssSetStatus('ok', `Synthetic test complete — ${width}×${height} Gray4 gradient`);
  document.getElementById('ss-save').disabled = false;
}

// ─── screenshot: UI helpers ─────────────────────────────────────────────────
function ssReset() {
  ssMeta = null;
  ssBuffer = null;
  ssChunksReceived = 0;
  ssSetStatus('', 'Ready.');
  ssShowProgress(false);
  document.getElementById('ss-canvas-wrap').classList.remove('visible');
  document.getElementById('ss-save').disabled = true;
}

function ssSetStatus(cls, text) {
  const el = document.getElementById('ss-status');
  el.className = cls;
  el.textContent = text;
}

function ssShowProgress(visible) {
  const wrap = document.getElementById('ss-progress-wrap');
  if (visible) wrap.classList.add('visible');
  else         wrap.classList.remove('visible');
  if (!visible) ssSetProgress(0, 1);
}

function ssSetProgress(received, total) {
  document.getElementById('ss-progress-bar').style.width = `${(received / total) * 100}%`;
  document.getElementById('ss-progress-label').textContent = `${received}/${total}`;
}

// ─── screenshot panel toggle ────────────────────────────────────────────────
document.getElementById('screenshot-panel-header').addEventListener('click', () => {
  document.getElementById('screenshot-panel').classList.toggle('collapsed');
});

// ─── logs: record handler ────────────────────────────────────────────────────
function handleLogRecord(msg) {
  const entry = {
    ts:      Date.now() - PAGE_LOAD_TIME,
    level:   msg.level,
    target:  msg.target,
    message: msg.message,
    dropped: msg.dropped_before || 0,
  };
  logEntries.push(entry);
  if (logEntries.length > LOG_MAX) logEntries.splice(0, logEntries.length - LOG_MAX);

  if (entry.dropped > 0) {
    totalDropped += entry.dropped;
    const badge = document.getElementById('logs-dropped-badge');
    badge.textContent = `dropped: ${totalDropped}`;
    badge.style.display = '';
  }

  scheduleLogRender();
}

function scheduleLogRender() {
  if (logNeedsRender) return;
  logNeedsRender = true;
  requestAnimationFrame(renderLogEntries);
}

function fmtLogTimestamp(ms) {
  const totalSec = Math.floor(ms / 1000);
  const min  = Math.floor(totalSec / 60);
  const sec  = totalSec % 60;
  const msec = ms % 1000;
  return `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(msec).padStart(3,'0')}`;
}

function renderLogEntries() {
  logNeedsRender = false;

  const minLevel = parseInt(document.getElementById('log-level-filter').value, 10);
  const search   = document.getElementById('log-search').value.toLowerCase();

  const filtered = logEntries.filter(e => {
    if ((LOG_LEVELS[e.level] ?? 0) < minLevel) return false;
    if (search && !e.target.toLowerCase().includes(search) && !e.message.toLowerCase().includes(search)) return false;
    return true;
  });

  document.getElementById('logs-count').textContent = `${filtered.length} entries`;

  const list = document.getElementById('log-list');
  const atBottom = list.scrollHeight - list.scrollTop <= list.clientHeight + 2;

  // Rebuild safely — no innerHTML with user data
  list.textContent = '';

  const frag = document.createDocumentFragment();
  for (const e of filtered) {
    const row = document.createElement('div');
    row.className = `log-row level-${e.level}`;

    const tsEl = document.createElement('span');
    tsEl.className = 'log-ts';
    tsEl.textContent = `[${fmtLogTimestamp(e.ts)}]`;

    const lvlEl = document.createElement('span');
    lvlEl.className = 'log-level';
    lvlEl.textContent = e.level.toUpperCase().padEnd(5);

    const targetEl = document.createElement('span');
    targetEl.className = 'log-target';
    targetEl.textContent = `${e.target}:`;

    const msgEl = document.createElement('span');
    msgEl.className = 'log-msg';
    msgEl.textContent = e.message;

    row.appendChild(tsEl);
    row.appendChild(lvlEl);
    row.appendChild(targetEl);
    row.appendChild(msgEl);
    frag.appendChild(row);
  }
  list.appendChild(frag);

  if (!logPaused && atBottom) list.scrollTop = list.scrollHeight;
}

// ─── logs: controls ──────────────────────────────────────────────────────────
document.getElementById('log-pause-btn').addEventListener('click', () => {
  logPaused = !logPaused;
  const btn = document.getElementById('log-pause-btn');
  btn.textContent = logPaused ? 'Resume' : 'Pause';
  btn.classList.toggle('paused', logPaused);
});

document.getElementById('log-trigger-btn').addEventListener('click', () => {
  send({ type: 'TriggerLog', request_id: nextId++ });
});

document.getElementById('log-clear-btn').addEventListener('click', () => {
  logEntries.length = 0;
  totalDropped = 0;
  const badge = document.getElementById('logs-dropped-badge');
  badge.style.display = 'none';
  badge.textContent = 'dropped: 0';
  renderLogEntries();
});

document.getElementById('log-level-filter').addEventListener('change', scheduleLogRender);
document.getElementById('log-search').addEventListener('input', scheduleLogRender);

// Pause on manual scroll upward; auto-resume when scrolled back to bottom
document.getElementById('log-list').addEventListener('scroll', () => {
  const list = document.getElementById('log-list');
  const atBottom = list.scrollHeight - list.scrollTop <= list.clientHeight + 2;
  if (atBottom && logPaused) {
    logPaused = false;
    const btn = document.getElementById('log-pause-btn');
    btn.textContent = 'Pause';
    btn.classList.remove('paused');
  } else if (!atBottom && !logPaused) {
    logPaused = true;
    const btn = document.getElementById('log-pause-btn');
    btn.textContent = 'Resume';
    btn.classList.add('paused');
  }
});

// ─── logs panel toggle ────────────────────────────────────────────────────────
document.getElementById('logs-panel-header').addEventListener('click', () => {
  document.getElementById('logs-panel').classList.toggle('collapsed');
});
// Prevent toolbar clicks from toggling collapse
document.querySelector('#logs-panel-header .logs-toolbar').addEventListener('click', e => {
  e.stopPropagation();
});

// ─── commands panel toggle ────────────────────────────────────────────────────
document.getElementById('commands-panel-header').addEventListener('click', () => {
  document.getElementById('commands-panel').classList.toggle('collapsed');
});

// ─── metrics ──────────────────────────────────────────────────────────────────

// State
const METRIC_RING = 300;            // samples per path
const metricData  = new Map();      // path → { ring: Float64Array, ringTs: Float64Array, head, count, min, max, sum }
let   metricFields = [];            // [{path, unit, minVal, maxVal}]
let   metricPaused = false;
let   metricAnimFrame = 0;

function collectMetricFields(schema, prefix) {
  if (schema.kind !== 'Struct') return [];
  const out = [];
  for (const f of schema.fields) {
    const fp = prefix ? `${prefix}.${f.name}` : f.name;
    if (f.metric) {
      out.push({ path: fp, unit: f.unit ?? null, minVal: f.min_val ?? null, maxVal: f.max_val ?? null });
    }
    if (f.schema?.kind === 'Struct') {
      out.push(...collectMetricFields(f.schema, fp));
    }
  }
  return out;
}

function renderMetricSubscribeList(fields) {
  metricFields = fields;
  const container = document.getElementById('metrics-subscribe-list');
  container.innerHTML = '';
  const countEl = document.getElementById('metrics-count');
  countEl.textContent = `${fields.length} available`;

  if (fields.length > 0) {
    document.getElementById('metrics-panel').classList.remove('collapsed');
  }

  for (const f of fields) {
    const item = el('div', 'metric-sub-item');

    const cb = el('input');
    cb.type = 'checkbox';
    cb.id = `mcb:${f.path}`;
    cb.dataset.path = f.path;

    const lbl = el('label');
    lbl.htmlFor = cb.id;
    lbl.textContent = f.path;

    const unitSpan = el('span', 'metric-unit');
    unitSpan.textContent = f.unit ? ` [${f.unit}]` : '';

    cb.addEventListener('change', () => {
      if (cb.checked) subscribeMetric(f.path);
      else            unsubscribeMetric(f.path);
    });

    item.append(cb, lbl, unitSpan);
    container.appendChild(item);
  }
}

function getInterval() {
  return parseInt(document.getElementById('metrics-interval').value, 10) || 500;
}

function getWindowSec() {
  return parseInt(document.getElementById('metrics-window').value, 10) || 60;
}

function subscribeMetric(path) {
  if (!metricData.has(path)) {
    metricData.set(path, {
      ring:   new Float64Array(METRIC_RING),
      ringTs: new Float64Array(METRIC_RING),
      head: 0, count: 0,
      min: Infinity, max: -Infinity, sum: 0,
    });
    ensureMetricCard(path);
  }
  const interval = getInterval();
  send({ type: 'SubscribeMetrics', request_id: nextId++, paths: [path], interval_ms: interval });
}

function unsubscribeMetric(path) {
  send({ type: 'UnsubscribeMetrics', request_id: nextId++, paths: [path] });
  metricData.delete(path);
  const card = document.getElementById(`mc:${path}`);
  if (card) card.remove();
}

function ensureMetricCard(path) {
  if (document.getElementById(`mc:${path}`)) return;
  const f = metricFields.find(x => x.path === path) ?? { path, unit: null };

  const card = el('div', 'metric-card');
  card.id = `mc:${path}`;

  const header = el('div', 'metric-card-header');

  const pathEl = el('span', 'metric-path');
  pathEl.textContent = path;

  const unitEl = el('span', 'metric-unit-label');
  unitEl.textContent = f.unit ? `[${f.unit}]` : '';

  const stats = el('div', 'metric-stats');
  stats.innerHTML = `
    <span class="cur"><em>cur</em> <span class="sv" id="ms-cur:${path}">—</span></span>
    <span><em>min</em> <span class="sv" id="ms-min:${path}">—</span></span>
    <span><em>max</em> <span class="sv" id="ms-max:${path}">—</span></span>
    <span><em>avg</em> <span class="sv" id="ms-avg:${path}">—</span></span>
  `;

  header.append(pathEl, unitEl, stats);

  const canvas = document.createElement('canvas');
  canvas.className = 'metric-canvas';
  canvas.id = `mc-canvas:${path}`;
  canvas.width  = 600;
  canvas.height = 80;

  card.append(header, canvas);
  document.getElementById('metrics-charts').appendChild(card);
}

function handleMetricBatch(msg) {
  if (metricPaused) return;
  const now = msg.timestamp_ms;
  for (const s of msg.samples) {
    const d = metricData.get(s.path);
    if (!d) continue;
    d.ring[d.head]   = s.value;
    d.ringTs[d.head] = now;
    d.head = (d.head + 1) % METRIC_RING;
    if (d.count < METRIC_RING) d.count++;
    if (s.value < d.min) d.min = s.value;
    if (s.value > d.max) d.max = s.value;
    d.sum += s.value;
  }

  // Batch all redraws into next animation frame
  if (metricAnimFrame) return;
  metricAnimFrame = requestAnimationFrame(() => {
    metricAnimFrame = 0;
    for (const [path, d] of metricData) {
      if (d.count === 0) continue;
      updateMetricStats(path, d);
      drawMetricChart(path, d);
    }
  });
}

function fmtNum(v) {
  if (!isFinite(v)) return '—';
  return Math.abs(v) >= 1000 ? v.toFixed(0) : v.toPrecision(4).replace(/\.?0+$/, '');
}

function updateMetricStats(path, d) {
  const cur = d.ring[(d.head - 1 + METRIC_RING) % METRIC_RING];
  const avg = d.sum / (d.count * (d.count >= METRIC_RING ? 1 : 1));
  const safeAvg = d.count > 0 ? d.sum / d.count : 0;

  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set(`ms-cur:${path}`, fmtNum(cur));
  set(`ms-min:${path}`, fmtNum(d.min));
  set(`ms-max:${path}`, fmtNum(d.max));
  set(`ms-avg:${path}`, fmtNum(safeAvg));
}

function drawMetricChart(path, d) {
  const canvas = document.getElementById(`mc-canvas:${path}`);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  if (d.count < 2) return;

  const windowMs = getWindowSec() * 1000;
  const nowTs = d.ringTs[(d.head - 1 + METRIC_RING) % METRIC_RING];
  const startTs = nowTs - windowMs;

  // Collect visible samples (within time window), oldest first
  const pts = [];
  for (let i = 0; i < d.count; i++) {
    const idx = (d.head - d.count + i + METRIC_RING) % METRIC_RING;
    const ts = d.ringTs[idx];
    if (ts >= startTs) pts.push({ ts, v: d.ring[idx] });
  }
  if (pts.length < 2) return;

  // Y range: use data min/max with 10% padding
  let yMin = Infinity, yMax = -Infinity;
  for (const p of pts) { if (p.v < yMin) yMin = p.v; if (p.v > yMax) yMax = p.v; }
  if (yMin === yMax) { yMin -= 1; yMax += 1; }
  const yRange = yMax - yMin;
  const yPad = yRange * 0.1;
  yMin -= yPad; yMax += yPad;

  // Grid lines
  ctx.strokeStyle = 'rgba(48,54,61,0.7)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = (i / 4) * H;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Line
  ctx.strokeStyle = '#58a6ff';
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const x = ((pts[i].ts - startTs) / windowMs) * W;
    const y = H - ((pts[i].v - yMin) / (yMax - yMin)) * H;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Fill under line
  const lastX = ((pts[pts.length - 1].ts - startTs) / windowMs) * W;
  const firstX = ((pts[0].ts - startTs) / windowMs) * W;
  ctx.lineTo(lastX, H); ctx.lineTo(firstX, H); ctx.closePath();
  ctx.fillStyle = 'rgba(88,166,255,0.08)';
  ctx.fill();
}

// ─── metrics: controls ───────────────────────────────────────────────────────

document.getElementById('metrics-pause-btn').addEventListener('click', () => {
  metricPaused = !metricPaused;
  const btn = document.getElementById('metrics-pause-btn');
  btn.textContent = metricPaused ? 'Resume' : 'Pause';
  btn.classList.toggle('paused', metricPaused);
});

document.getElementById('metrics-unsub-btn').addEventListener('click', () => {
  const paths = [...metricData.keys()];
  if (paths.length === 0) return;
  send({ type: 'UnsubscribeMetrics', request_id: nextId++, paths: [] }); // empty = unsubscribe all
  metricData.clear();
  document.getElementById('metrics-charts').innerHTML = '';
  // Uncheck all checkboxes
  document.querySelectorAll('#metrics-subscribe-list input[type="checkbox"]').forEach(cb => {
    cb.checked = false;
  });
});

document.getElementById('metrics-interval').addEventListener('change', () => {
  const paths = [...metricData.keys()];
  if (paths.length === 0) return;
  const interval = getInterval();
  send({ type: 'SubscribeMetrics', request_id: nextId++, paths, interval_ms: interval });
});

document.getElementById('metrics-panel-header').addEventListener('click', () => {
  document.getElementById('metrics-panel').classList.toggle('collapsed');
});

// ─── helpers ─────────────────────────────────────────────────────────────────
function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

function setStatus(cls, text) {
  const el = document.getElementById('status');
  el.className = cls;
  document.getElementById('status-text').textContent = text;
}

connect();
</script>
