[package]
name = "epaper"
version = "0.1.0"
edition = "2021"

[dependencies]
log                    = "0.4"
serde                  = { version = "1", default-features = false, features = ["derive"] }
embedded-hal           = "1"
embedded-graphics-core = "0.4"
embedded-graphics      = "0.8"
embedded-storage       = "0.3"
embedded-storage-async = "0.4"
sequential-storage     = "3.0"
iris-ui                     = { path = "../iris-ui" }
embedded-graphics-simulator = { version = "0.8.0", optional = true }
micromath = "2.1.0"

# ESP32-specific dependencies — only compiled when targeting xtensa
[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal                = { version = "1.1.0", features = ["esp32s3", "unstable"] }
esp-alloc              = "0.10.0"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-backtrace          = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println            = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-storage            = { version = "0.4", features = ["esp32s3", "nor-flash"] }
esp-radio              = { version = "0.18.0", features = ["wifi", "esp32s3"] }
esp-rtos               = { version = "0.3.0",  features = ["esp32s3", "esp-radio", "embassy"] }
embedded-sdmmc         = { version = "0.9", default-features = false }
embedded-hal-bus       = "0.2"
embassy-executor       = "0.10.0"
embassy-net            = { version = "0.9.1",  features = ["dhcpv4", "medium-ethernet", "udp"] }
edge-dhcp              = "0.8.0"
edge-nal               = "0.7.0"
edge-nal-embassy       = "0.9.0"
embedded-io-async      = "0.7.0"
embassy-sync           = { version = "0.6",   optional = true }
embassy-time           = "0.5.0"
static_cell            = "2.1.0"
embedded-inspect       = { path = "../embedded-inspect/embedded-inspect", optional = true }
embedded-websocket     = { version = "0.9", default-features = false, optional = true }
httparse               = { version = "1",   default-features = false, optional = true }
qrcode-core            = { version = "2",   optional = true }

[features]
sim           = ["iris-ui/std", "dep:embedded-graphics-simulator"]
debug-inspect = [
    "dep:embassy-sync",
    "dep:embedded-inspect",
    "dep:embedded-websocket",
    "dep:httparse",
    "dep:qrcode-core",
    "embassy-net/tcp",
    "embassy-net/multicast",
]
ap-web = [
    "dep:qrcode-core",
    "embassy-net/tcp",
    "embassy-net/multicast",
]

[[example]]
name = "iris_demo_sim"
required-features = ["sim"]

[[example]]
name = "inspect_demo"
required-features = ["debug-inspect"]

[[example]]
name = "ap_web_qr"
required-features = ["ap-web"]

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = "fat"
opt-level        = "s"
overflow-checks  = false

[package.metadata.espflash]
partition_table = "partitions.csv"
